          <circle cx="6" cy="12" r="3"></circle>

          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>

  <script src="assets/js/cms.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
    const GUIDES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSanJxg3Q83z1Cr0PpY2rSAY9yUNc3YWYmrpj3v-hNQmDyd1TYLlDYiYKVRGAohiM1kkChDLIkmfooI/pub?gid=618976969&single=true&output=csv';
    const TUTORIALS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSanJxg3Q83z1Cr0PpY2rSAY9yUNc3YWYmrpj3v-hNQmDyd1TYLlDYiYKVRGAohiM1kkChDLIkmfooI/pub?gid=508134725&single=true&output=csv';
    const trackerGrid = document.getElementById('tracker-grid');
    const tutorialsGrid = document.getElementById('tutorials-grid');
    const trackerLoading = document.getElementById('tracker-loading');
    const tutorialsLoading = document.getElementById('tutorials-loading');

    const guidesList = document.getElementById('guides-list');
    const guideSearch = document.getElementById('guide-search');
    const guidesLoading = document.getElementById('guides-loading');
    let allGuides = [];

    window.cms.injectSkeletons(trackerLoading, 'compact', 3);
    window.cms.injectSkeletons(tutorialsLoading, 'compact', 3);
    window.cms.injectSkeletons(guidesLoading, 'gallery', 6);

    function getGuideImage(title) {
      const imageMap = {
        'WiFi Connectivity on Campus': 'assets/petitions/2026-06-19 petition for the improvement of wifi connectivity in the traditional halls.jpg',
        'Course Registration Deadline Extension': 'assets/petitions/2026-06-16 petition for course registration deadline extension.jpg',
        'Exam Hall Belongings Security': 'assets/petitions/2026-06-30 petition on the inadequate security measures for students valuables at examiniation centers.jpg',
        'Transportation Fares On Campus': 'assets/petitions/2026.06.30 address on transportation fares.jpg',
        'Supplementary Resit Timetable Distribution': 'assets/guides/notice on suplementary resit registration.jpg',
        'Student Data / Internet Connectivity': 'assets/petitions/2026-06-19 request for the immediate attention to the poor wifi connectivity issues in the 24hr reading room.jpg',
        'How to Prepare for Science Course Finals (CHEM113 / PHYS143 / ABCS101 / MATH101)': 'assets/petitions/2026.07.02 organic chemistry pre ia tutorials on teams.jpg',
        'How to Prepare for Your UGRC IA': 'assets/petitions/2026.07.04 african studies pre-ia tutorial on zoom.jpg',
        'Free Tutorial Sessions (Zoom / Teams)': 'assets/petitions/2026.07.04  african studies pre ai tutorial on teams.jpg'
      };
      return imageMap[title];
    }

    function renderGuides(guides) {
      guidesList.innerHTML = guides.length
        ? guides.map((guide) => {
          const guideImage = getGuideImage(guide.title);
          const encodedImagePath = guideImage ? guideImage.split('/').map(p => encodeURIComponent(p)).join('/') : null;
          return `
          <article class="gallery-item" data-search="${(guide.title + ' ' + guide.type + ' ' + guide.summary + ' ' + guide.status).toLowerCase()}">
            ${encodedImagePath ? `<img src="${encodedImagePath}" alt="${guide.title}" class="guide-thumbnail">` : `<div class="course-icon">📝</div>`}
            <div class="course-code">${guide.type || 'Guide'}</div>
            <h4>${guide.title || 'Guide'}</h4>
            <p>${guide.summary || 'No summary provided.'}</p>
            <p style="margin-top: 0.6rem;"><strong>Status:</strong> ${guide.status || 'Unknown'}</p>
            ${guide.date && !window.cms.isPlaceholderValue(guide.date) ? `<p style="margin-top: 0.3rem;"><strong>Date:</strong> ${guide.date}</p>` : ''}
          </article>`;
        }).join('')
        : `<div class="empty-state" role="status">
             <div style="font-size:1.6rem;margin-bottom:0.4rem;">🔍</div>
             <strong>No guides match your search.</strong>
             <p style="margin-top:0.3rem;font-size:0.85rem;color:var(--brown-mid);">Try a different keyword or clear the search field.</p>
           </div>`;

      const summary = document.getElementById('guide-summary');
      if (summary) {
        const query = guideSearch.value.trim();
        const count = guides.length;
        summary.textContent = query
          ? `${count} ${count === 1 ? 'guide' : 'guides'} match "${query}".`
          : `${allGuides.length} ${allGuides.length === 1 ? 'guide is' : 'guides are'} available.`;
      }
    }

    function applyGuideSearch(query) {
      const normalized = query.toLowerCase();
      const filtered = allGuides.filter((guide) => {
        const haystack = `${guide.title} ${guide.type} ${guide.summary} ${guide.status}`.toLowerCase();
        const keywords = normalized.split(' ').filter(Boolean);
        return keywords.every(keyword => haystack.includes(keyword));
      });
      renderGuides(filtered);
    }

    guideSearch.addEventListener('input', window.cms.debounce((event) => applyGuideSearch(event.target.value), 300));

    const lightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxShare = document.getElementById('lightbox-share');

    guidesList.addEventListener('click', (e) => {
      if (e.target.classList.contains('guide-thumbnail')) {
        lightboxImg.src = e.target.getAttribute('src');
        lightboxImg.alt = e.target.getAttribute('alt');
        lightboxImg.classList.remove('zoomed');
        lightbox.classList.add('active');
      }
    });

    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightboxImg.addEventListener('click', () => {
      lightboxImg.classList.toggle('zoomed');
    });

    lightboxShare.addEventListener('click', async () => {
      try {
        if (navigator.share) {
          const url = new URL(lightboxImg.getAttribute('src'), window.location.origin).href;
          await navigator.share({ title: lightboxImg.alt, url: url });
        } else {
          alert('Sharing is not supported on this browser.');
        }
      } catch (err) {
        console.error('Share failed:', err);
      }
    });

    async function init() {
      try {
        const guideRows = await window.cms.fetchCSV(GUIDES_CSV);
        const tutorialRows = await window.cms.fetchCSV(TUTORIALS_CSV);

        // Fetch live WhatsApp channel updates from Vercel KV API endpoint
        let liveUpdates = [];
        try {
          const apiRes = await fetch('/api/updates');
          if (apiRes.ok) {
            const apiData = await apiRes.json();
            if (apiData.success && Array.isArray(apiData.updates)) {
              liveUpdates = apiData.updates;
            }
          }
        } catch (apiErr) {
          console.log('Live updates API fallback to CSV:', apiErr);
        }

        // 1. Process ADVOCACY (Tracker)
        const csvTracker = guideRows.map((row) => ({
          date: row[0] || '',
          type: row[1] || '',
          title: row[2] || '',
          summary: row[3] || '',
          status: row[4] || '',
          sourceLink: row[5] || ''
        })).filter((item) => item.title && !window.cms.isPlaceholderValue(item.title));

        const liveAdvocacy = liveUpdates
          .filter(u => u.category === 'ADVOCACY')
          .map(item => ({
            date: item.date || '',
            type: 'Advocacy',
            title: item.title || 'WhatsApp Update',
            summary: item.summary || '',
            status: item.status || 'ONGOING',
            sourceLink: item.links?.[0] || ''
          }));
        const tracker = [...liveAdvocacy, ...csvTracker];

        // 2. Process HOW-TO GUIDES (Gallery)
        const liveGuides = liveUpdates
          .filter(u => u.category === 'HOW-TO GUIDE')
          .map(item => ({
            date: item.date || '',
            type: 'How-To Guide',
            title: item.title || '',
            summary: item.summary || '',
            status: item.status || 'RESOLVED',
            sourceLink: item.links?.[0] || '',
            imageUrl: item.imageUrl || null
          }));
        
        allGuides = [...liveGuides, ...csvTracker];
        renderGuides(allGuides);
        guidesLoading.style.display = 'none';

        // 3. Process INITIATIVES / TUTORIALS
        const csvTutorials = tutorialRows.map((row) => ({
          date: row[0] || '',
          time: row[1] || '',
          title: row[2] || '',
          platform: row[3] || '',
          platformLink: row[4] || '',
          whatsappLink: row[5] || '',
          notes: row[6] || ''
        })).filter((tutorial) => tutorial.title && !window.cms.isPlaceholderValue(tutorial.title));

        const liveTutorials = liveUpdates
          .filter(u => ['INITIATIVE', 'DATE TO BE ANNOUNCED'].includes(u.category))
          .map(item => ({
            date: item.date || 'Date to be announced',
            time: '',
            title: item.title || '',
            platform: 'WhatsApp Live',
            platformLink: item.links?.[0] || '',
            whatsappLink: '',
            notes: item.summary || ''
          }));
        
        const tutorials = [...liveTutorials, ...csvTutorials];

        trackerGrid.innerHTML = tracker.length
          ? tracker.map((item) => `
            <article class="card compact-card">
              <div class="course-code">${item.type || 'Advocacy'}</div>
              <h3 class="course-name">${item.title}</h3>
              <p class="course-desc">${item.summary || 'More details will be shared soon.'}</p>
              <p class="course-desc"><strong>Status:</strong> <span class="badge ${String(item.status).toLowerCase().replace(/\s+/g, '-') || 'ongoing'}">${item.status || 'Ongoing'}</span></p>
              ${item.date && !window.cms.isPlaceholderValue(item.date) ? `<p class="course-desc"><strong>Date:</strong> ${item.date}</p>` : ''}
            </article>`).join('')
          : '<div class="empty-state">No advocacy updates are currently published.</div>';

        tutorialsGrid.innerHTML = tutorials.length
          ? tutorials.map((item) => `
            <article class="card compact-card">
              <div class="course-code">${item.date && !window.cms.isPlaceholderValue(item.date) ? item.date : 'Date to be announced'}</div>
              <h3 class="course-name">${item.title}</h3>
              <p class="course-desc">${item.notes || 'More details will be shared soon.'}</p>
              <div class="course-open">${item.platform || 'Platform'}</div>
              ${item.platformLink && window.cms.isUsableLink(item.platformLink) ? `<p style="margin-top:0.6rem;"><a href="${item.platformLink}" target="_blank" rel="noopener">Open platform link</a></p>` : ''}
              ${item.whatsappLink && window.cms.isUsableLink(item.whatsappLink) ? `<p style="margin-top:0.3rem;"><a href="${item.whatsappLink}" target="_blank" rel="noopener">Join WhatsApp channel</a></p>` : ''}
            </article>`).join('')
          : '<div class="empty-state">No tutorials are currently published.</div>';

        trackerLoading.style.display = 'none';
        tutorialsLoading.style.display = 'none';
      } catch (error) {
        console.error(error);
        window.cms.showErrorState(trackerLoading, 'advocacy tracker', init, 'compact');
        window.cms.showErrorState(tutorialsLoading, 'tutorials', init, 'compact');
        window.cms.showErrorState(guidesLoading, 'guides', init, 'gallery');
      }
    }

    init();
    });
  </script>
